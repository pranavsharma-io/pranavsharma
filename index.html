<html lang="en">
<head>

  <style>
:root {
  --bg-color: #121212;
  --text-color: #e0e0e0;
  --name-color: #ffffff;
  --accent-color: #bb86fc;
  --accent-soft: rgba(187, 134, 252, 0.14);
  --accent-soft-strong: rgba(187, 134, 252, 0.28);
  --nav-bg: #1e1e1e;
  --shadow-color: rgba(0, 0, 0, 0.45);
  --backdrop-color: rgba(0, 0, 0, 0.5);
  --font-display: 'Great Vibes', cursive;
  --font-body: 'Poppins', sans-serif;
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
}

body.light-theme {
  --bg-color: #fdfaf6;
  --text-color: #5d5d5d;
  --name-color: #2c2c2c;
  --nav-bg: #f9f4ef;
  --shadow-color: rgba(44, 44, 44, 0.12);
  --backdrop-color: rgba(44, 44, 44, 0.25);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  background-color: var(--bg-color);
  color: var(--text-color);
  font-family: var(--font-body);
  font-weight: 300;
  overflow-x: hidden;
  min-height: 100vh;
  transition: background-color 0.5s ease, color 0.5s ease;
}

::selection { background: var(--accent-color); color: var(--bg-color); }
a { text-decoration: none; }
button { font-family: inherit; border: none; background: none; cursor: pointer; }

a:focus-visible,
button:focus-visible,
.pet-blob:focus-visible {
  outline: 2px solid var(--accent-color);
  outline-offset: 4px;
  border-radius: 4px;
}

/* ── Icon buttons (hamburger + theme) ── */
.icon-btn {
  position: fixed;
  top: 2rem;
  width: 46px;
  height: 46px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  color: var(--text-color);
  font-size: 1.15rem;
  z-index: 1100;
  transition: background-color 0.3s ease, color 0.3s ease, transform 0.3s ease;
}

.icon-btn:hover {
  background-color: var(--accent-soft);
  color: var(--accent-color);
  transform: translateY(-2px);
}

.hamburger { left: 2rem; }
.theme-toggle { right: 2rem; }

.hamburger {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
}

.hamburger .bar {
  width: 20px;
  height: 2px;
  background-color: var(--text-color);
  border-radius: 2px;
  transition: transform 0.35s var(--ease), opacity 0.25s ease, background-color 0.3s ease;
}

.hamburger:hover .bar { background-color: var(--accent-color); }
.hamburger.open .bar:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.hamburger.open .bar:nth-child(2) { opacity: 0; }
.hamburger.open .bar:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

/* ── Theme toggle ── */
.icon-moon, .icon-sun {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) rotate(0deg);
  transition: opacity 0.45s ease, transform 0.55s var(--ease);
}

.icon-moon { opacity: 1; }
.icon-sun  { opacity: 0; transform: translate(-50%, -50%) rotate(-90deg); }
body.light-theme .icon-moon { opacity: 0; transform: translate(-50%, -50%) rotate(90deg); }
body.light-theme .icon-sun  { opacity: 1; transform: translate(-50%, -50%) rotate(0deg); }

/* ── Nav backdrop ── */
.nav-backdrop {
  position: fixed;
  inset: 0;
  background: var(--backdrop-color);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
  z-index: 999;
}
.nav-backdrop.visible { opacity: 1; pointer-events: auto; }

/* ── Side nav ── */
.side-nav {
  position: fixed;
  top: 0;
  left: 0;
  height: 100vh;
  width: 320px;
  max-width: 85vw;
  background-color: var(--nav-bg);
  transform: translateX(-100%);
  transition: transform 0.5s var(--ease), background-color 0.5s ease;
  z-index: 1000;
  padding: 6rem 2.2rem 2rem;
  box-shadow: 6px 0 40px var(--shadow-color);
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--accent-soft-strong) transparent;
}
.side-nav.open { transform: translateX(0); }

.side-nav::-webkit-scrollbar { width: 4px; }
.side-nav::-webkit-scrollbar-track { background: transparent; }
.side-nav::-webkit-scrollbar-thumb { background: var(--accent-soft-strong); border-radius: 2px; }

/* ── Section titles ── */
.projects-title {
  font-family: var(--font-body);
  font-weight: 500;
  font-size: 0.95rem;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--accent-color);
  margin-bottom: 2rem;
  padding-bottom: 0.9rem;
  border-bottom: 1px solid var(--accent-soft-strong);
}

.servers-title,
.achievements-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.6rem;
  flex-wrap: wrap;
}

/* ── Network usage badge ── */
.network-usage {
  font-size: 0.72rem;
  font-weight: 400;
  letter-spacing: normal;
  text-transform: none;
  color: var(--text-color);
  opacity: 0.75;
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  white-space: nowrap;
}

.network-usage i { font-size: 0.68rem; }
.network-usage .fa-arrow-down { color: #4fc3f7; }
.network-usage .fa-arrow-up   { color: #ff8a65; }

/* ── Network total (under servers title) ── */
.network-total {
  font-size: 0.7rem;
  font-weight: 400;
  color: var(--text-color);
  opacity: 0.5;
  margin-top: -1.4rem;
  margin-bottom: 1.4rem;
  letter-spacing: 0.01em;
}

/* ── Project/server buttons ── */
.projects-container { display: flex; flex-direction: column; gap: 0.85rem; }

.project-button {
  display: flex;
  align-items: center;
  gap: 0.85rem;
  padding: 0.9rem 1.1rem;
  border-radius: 12px;
  color: var(--text-color);
  font-size: 0.9rem;
  font-weight: 300;
  letter-spacing: 0.01em;
  border: 1px solid transparent;
  transition: background-color 0.3s ease, border-color 0.3s ease, transform 0.3s var(--ease), color 0.3s ease;
  position: relative;
}

.project-button .btn-icon {
  color: var(--accent-color);
  width: 18px;
  text-align: center;
  font-size: 0.95rem;
  flex-shrink: 0;
}

.project-button:hover,
.project-button:focus-visible {
  background-color: var(--accent-soft);
  border-color: var(--accent-soft-strong);
  transform: translateX(6px);
}

.servers-section { margin-top: 2.5rem; }
.project-button-text { flex: 1; }

/* ── Spinner inside button ── */
.project-button-status {
  font-size: 0.8rem;
  color: var(--accent-color);
  opacity: 0.7;
  flex-shrink: 0;
}

/* ── Freshness dot ── */
.freshness-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  flex-shrink: 0;
}
.freshness-dot.fresh   { background: #4caf50; box-shadow: 0 0 8px 1px #4caf5088; }
.freshness-dot.stale   { background: #ff9800; box-shadow: 0 0 8px 1px #ff980088; }
.freshness-dot.expired { background: #f44336; box-shadow: 0 0 8px 1px #f4433688; }
.freshness-dot.unknown { background: var(--text-color); opacity: 0.45; box-shadow: 0 0 4px 1px var(--shadow-color); }

/* ── Button states ── */
.project-button.loading { cursor: wait; opacity: 0.6; pointer-events: none; }

.project-button.unavailable { cursor: not-allowed; opacity: 0.45; }
.project-button.unavailable:hover,
.project-button.unavailable:focus-visible {
  background-color: transparent;
  border-color: transparent;
  transform: none;
}

/* ── Sheet error banner ── */
.sheet-error {
  font-size: 0.72rem;
  color: #f44336;
  opacity: 0.8;
  margin-top: -1rem;
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  gap: 0.4rem;
}
.sheet-error.hidden { display: none; }

/* ── Refresh button ── */
.refresh-btn {
  font-size: 0.72rem;
  color: var(--accent-color);
  opacity: 0.8;
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.25rem 0.5rem;
  border-radius: 6px;
  transition: background-color 0.2s ease, opacity 0.2s ease;
  cursor: pointer;
}
.refresh-btn:hover { background-color: var(--accent-soft); opacity: 1; }
.refresh-btn.spinning i { animation: spinOnce 0.7s linear; }

@keyframes spinOnce {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}

/* ── Hero ── */
.hero {
  position: relative;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2.2rem;
  padding: 2rem 1.5rem;
  text-align: center;
  opacity: 0;
  transform: translateY(22px);
  animation: heroReveal 1s var(--ease) forwards;
  animation-delay: 0.2s;
  transition: opacity 0.4s ease, filter 0.4s ease, transform 0.4s ease;
}

body.nav-open .hero {
  opacity: 0.4;
  filter: blur(1px);
  transform: scale(0.98);
}

.hero-glow {
  position: absolute;
  top: 50%;
  left: 50%;
  width: min(700px, 90vw);
  height: min(700px, 90vw);
  transform: translate(-50%, -50%);
  background: radial-gradient(circle, var(--accent-soft) 0%, transparent 70%);
  pointer-events: none;
  z-index: -1;
  transition: background 0.5s ease;
}

.name {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(3rem, 11vw, 6rem);
  line-height: 1.15;
  color: var(--name-color);
  transition: color 0.5s ease;
}

.links-container {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 0.9rem;
  max-width: 620px;
}

.link-button {
  display: inline-flex;
  align-items: center;
  gap: 0.55rem;
  padding: 0.75rem 1.35rem;
  border: 1.5px solid var(--accent-color);
  border-radius: 999px;
  color: var(--text-color);
  font-size: 0.85rem;
  font-weight: 400;
  letter-spacing: 0.02em;
  transition: background-color 0.35s var(--ease), color 0.35s var(--ease), transform 0.35s var(--ease), box-shadow 0.35s var(--ease), border-color 0.5s ease;
}

.link-button i { font-size: 0.9rem; }

.link-button:hover,
.link-button:focus-visible {
  background-color: var(--accent-color);
  color: var(--bg-color);
  transform: translateY(-3px);
  box-shadow: 0 10px 26px var(--accent-soft-strong);
}

/* ── Pet ── */
.pet-wrap {
  position: fixed;
  bottom: 2rem;
  right: 2rem;
  z-index: 500;
  animation: petFloat 5.5s ease-in-out infinite;
}

.pet-blob {
  position: relative;
  width: 60px;
  height: 60px;
  background-color: var(--accent-color);
  box-shadow: 0 14px 30px var(--accent-soft-strong);
  cursor: pointer;
  animation: petMorph 7s ease-in-out infinite;
  transition: transform 0.3s var(--ease), background-color 0.5s ease;
}

.pet-blob:hover { transform: scale(1.08); }
.pet-blob.squish { animation: petMorph 7s ease-in-out infinite, petSquish 0.55s ease; }

.pet-eye {
  position: absolute;
  top: 36%;
  width: 11px;
  height: 11px;
  background-color: var(--bg-color);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background-color 0.5s ease;
}

.pet-eye.left  { left: 26%; }
.pet-eye.right { right: 26%; }

.pet-pupil {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background-color: var(--name-color);
  transition: background-color 0.5s ease, transform 0.12s ease-out;
}

.pet-bubble {
  position: absolute;
  bottom: 82px;
  right: -8px;
  min-width: max-content;
  background-color: var(--nav-bg);
  color: var(--text-color);
  padding: 0.55rem 0.95rem;
  border-radius: 14px;
  font-size: 0.8rem;
  font-weight: 400;
  box-shadow: 0 10px 26px var(--shadow-color);
  opacity: 0;
  transform: translateY(8px) scale(0.92);
  transition: opacity 0.3s ease, transform 0.3s ease, background-color 0.5s ease;
  pointer-events: none;
}

.pet-bubble.show { opacity: 1; transform: translateY(0) scale(1); }

.pet-bubble::after {
  content: '';
  position: absolute;
  bottom: -5px;
  right: 24px;
  width: 10px;
  height: 10px;
  background-color: var(--nav-bg);
  transform: rotate(45deg);
  transition: background-color 0.5s ease;
}

/* ── Animations ── */
@keyframes heroReveal { to { opacity: 1; transform: translateY(0); } }

@keyframes petFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-14px); }
}

@keyframes petMorph {
  0%, 100% { border-radius: 60% 40% 55% 45% / 55% 45% 60% 40%; }
  25%       { border-radius: 45% 55% 60% 40% / 40% 60% 45% 55%; }
  50%       { border-radius: 50% 50% 40% 60% / 60% 40% 55% 45%; }
  75%       { border-radius: 55% 45% 50% 50% / 45% 55% 40% 60%; }
}

@keyframes petSquish {
  0%   { transform: scale(1, 1); }
  30%  { transform: scale(1.22, 0.8); }
  55%  { transform: scale(0.88, 1.12); }
  75%  { transform: scale(1.06, 0.95); }
  100% { transform: scale(1, 1); }
}

/* ── Responsive ── */
@media (max-width: 900px) {
  .side-nav { width: 300px; padding: 5.5rem 2rem 2rem; }
}

@media (max-width: 600px) {
  .icon-btn { top: 1.25rem; width: 42px; height: 42px; }
  .hamburger { left: 1.25rem; }
  .theme-toggle { right: 1.25rem; }
  .hero { gap: 1.6rem; padding: 1.5rem 1.25rem; }
  .name { font-size: clamp(2.6rem, 13vw, 3.6rem); }
  .links-container { gap: 0.6rem; }
  .link-button { font-size: 0.78rem; padding: 0.65rem 1.05rem; }
  .side-nav { width: 82vw; padding: 5rem 1.5rem 2rem; }
  .pet-wrap { bottom: 1.25rem; right: 1.25rem; }
  .pet-blob { width: 50px; height: 50px; }
  .pet-eye { width: 9px; height: 9px; }
  .pet-pupil { width: 4px; height: 4px; }
  .pet-bubble { font-size: 0.75rem; bottom: 70px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}
  </style>

  <script>
  /* ─────────────────────────────────────────────
     CONFIG
  ───────────────────────────────────────────── */
  const SHEET_ID  = '1MHjpvU0m-zOCUG59hN9JIxgfN8si_gsntl8c1w5B7Kg';
  const SHEET_GID = '0';
  const FETCH_TIMEOUT_MS = 8000;

  const ACHIEVEMENTS_SHEET_ID  = '19f2TNFoT9ny01VBJv70APTq7Y_p66jr26VPWT1sE1zQ';
  const ACHIEVEMENTS_SHEET_GID = '0';
  const DEFAULT_ACHIEVEMENT_ICON = 'fa-solid fa-trophy';

  /*
   * Server definitions — maps each UI card to a sheet label.
   * Add or remove entries here to control what appears in the nav.
   *
   * jellyfin_suffix: optional path appended to the URL for that server
   * icon           : Font Awesome class(es)
   * label          : display name
   * sheetLabel     : substring to look for in the sheet (case-insensitive)
   */
  const SERVER_DEFS = [
    { id: 'photos',    label: 'Photos',       sheetLabel: 'immich',       icon: 'fa-solid fa-images'       },
    { id: 'music',     label: 'Music',        sheetLabel: 'jellyfin',     icon: 'fa-solid fa-music',
      urlSuffix: '/web/#/music?topParentId=7e64e319657a9516ec78490da03edccb&collectionType=music&tab=5' },
    { id: 'files',     label: 'Files',        sheetLabel: 'file browser', icon: 'fa-solid fa-folder-open'  },
    { id: 'chat',      label: 'Chat',         sheetLabel: 'rocket.chat',  icon: 'fa-solid fa-comments'     },
    { id: 'vault',     label: 'Vault',        sheetLabel: 'vaultwarden',  icon: 'fa-solid fa-shield-halved'},
    { id: 'notes',     label: 'Notes',        sheetLabel: 'trilium',      icon: 'fa-solid fa-note-sticky'  },
    { id: 'pdf',       label: 'PDF Tools',    sheetLabel: 'stirling pdf', icon: 'fa-solid fa-file-pdf'     },
  ];

  /* ─────────────────────────────────────────────
     THEME & ACCENT
  ───────────────────────────────────────────── */
  const dailyAccents = ['#C2185B','#F57C00','#D32F2F','#D81B60','#7B1FA2','#E64A19','#FF4081'];

  function hexToRgb(hex) {
    const v = hex.replace('#','');
    return { r: parseInt(v.slice(0,2),16), g: parseInt(v.slice(2,4),16), b: parseInt(v.slice(4,6),16) };
  }

  function applyDailyAccent() {
    const color = dailyAccents[new Date().getDay()];
    const { r, g, b } = hexToRgb(color);
    const light = document.body.classList.contains('light-theme');
    const sa = light ? 0.10 : 0.14, ss = light ? 0.20 : 0.28;
    document.documentElement.style.setProperty('--accent-color', color);
    document.documentElement.style.setProperty('--accent-soft',       `rgba(${r},${g},${b},${sa})`);
    document.documentElement.style.setProperty('--accent-soft-strong',`rgba(${r},${g},${b},${ss})`);
  }

  /* ─────────────────────────────────────────────
     SHEET FETCH (JSONP)
  ───────────────────────────────────────────── */
  let jsonpSeq = 0;

  function fetchSheetRowsFrom(sheetId, gid) {
    return new Promise((resolve, reject) => {
      const cb = `__sheetCb_${Date.now()}_${jsonpSeq++}`;
      const script = document.createElement('script');
      let done = false;

      const tid = setTimeout(() => {
        if (done) return; done = true; cleanup();
        reject(new Error('Sheet request timed out'));
      }, FETCH_TIMEOUT_MS);

      function cleanup() {
        clearTimeout(tid);
        delete window[cb];
        script.remove();
      }

      window[cb] = (res) => {
        if (done) return; done = true; cleanup();
        try {
          const rows = (res.table && res.table.rows) || [];
          resolve(rows.map(row =>
            (row.c || []).map(cell => (cell && cell.v != null ? String(cell.v).trim() : ''))
          ));
        } catch (err) { reject(err); }
      };

      script.onerror = () => {
        if (done) return; done = true; cleanup();
        reject(new Error('Sheet script load failed'));
      };

      script.src = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?gid=${gid}&tqx=out:json;responseHandler:${cb}`;
      document.head.appendChild(script);
    });
  }

  function fetchSheetRows() {
    return fetchSheetRowsFrom(SHEET_ID, SHEET_GID);
  }

  function fetchAchievementsRows() {
    return fetchSheetRowsFrom(ACHIEVEMENTS_SHEET_ID, ACHIEVEMENTS_SHEET_GID);
  }

  /* ─────────────────────────────────────────────
     SHEET PARSING HELPERS
  ───────────────────────────────────────────── */

  /** Find a URL in any row that has `needle` as a label in an adjacent cell */
  function findUrl(rows, needle) {
    const n = needle.toLowerCase();
    for (const cells of rows) {
      for (let i = 0; i < cells.length - 1; i++) {
        if ((cells[i] || '').toLowerCase().includes(n)) {
          const url = cells[i + 1] || '';
          if (/^https?:\/\//i.test(url)) return url;
        }
      }
    }
    return null;
  }

  /**
   * Find network usage values.
   * Sheet row format: ... "Network Usage (Cumulative)"  "3.39 GB"  "10.92 GB"  "14.31 GB"  timestamp ...
   * Returns { download, upload, total } or null.
   */
  function findNetworkUsage(rows) {
    for (const cells of rows) {
      for (let i = 0; i < cells.length; i++) {
        if ((cells[i] || '').toLowerCase().includes('network usage')) {
          // next three values: download, upload, total
          const [dl, ul, total] = [cells[i+1], cells[i+2], cells[i+3]];
          if (dl && ul) return { download: dl, upload: ul, total: total || null };
        }
      }
    }
    return null;
  }

  /**
   * Find a timestamp cell for a given label.
   * E.g. "Immich Tunnel Link"  <url>  <timestamp>
   * Returns a Date or null.
   */
  function findTimestamp(rows, needle) {
    const n = needle.toLowerCase();
    for (const cells of rows) {
      for (let i = 0; i < cells.length - 2; i++) {
        if ((cells[i] || '').toLowerCase().includes(n)) {
          // timestamp is usually 2 cols after the label
          const raw = cells[i + 2] || '';
          if (raw) {
            const d = new Date(raw);
            if (!isNaN(d.getTime())) return d;
          }
        }
      }
    }
    return null;
  }

  /** Age-based freshness: green < 2 h, orange < 12 h, red otherwise */
  function freshnessDot(timestamp) {
    if (!timestamp) return 'unknown';
    const age = (Date.now() - timestamp.getTime()) / 3600000; // hours
    if (age < 2)  return 'fresh';
    if (age < 12) return 'stale';
    return 'expired';
  }

  /* ─────────────────────────────────────────────
     RENDER SERVERS
  ───────────────────────────────────────────── */
  function renderServers(rows) {
    const container   = document.getElementById('serversContainer');
    const networkEl   = document.getElementById('networkUsage');
    const errorEl     = document.getElementById('sheetError');

    // Clear skeleton
    container.innerHTML = '';

    // Network usage badge
    const net = rows ? findNetworkUsage(rows) : null;
    if (net) {
      networkEl.innerHTML = `
        <i class="fa-solid fa-arrow-down" title="Download"></i>${net.download}
        <i class="fa-solid fa-arrow-up"   title="Upload"></i>${net.upload}
      `;
      // Optionally show total as a sub-line
      if (net.total) {
        const existingTotal = document.getElementById('networkTotal');
        if (!existingTotal) {
          const totalEl = document.createElement('p');
          totalEl.id = 'networkTotal';
          totalEl.className = 'network-total';
          totalEl.textContent = `Total: ${net.total}`;
          document.querySelector('.servers-section').insertBefore(
            totalEl,
            document.getElementById('sheetError')
          );
        } else {
          existingTotal.textContent = `Total: ${net.total}`;
        }
      }
    } else {
      networkEl.textContent = rows ? '' : '';
    }

    // Show/hide error banner
    if (!rows) {
      errorEl.classList.remove('hidden');
    } else {
      errorEl.classList.add('hidden');
    }

    // Render each server button
    SERVER_DEFS.forEach(def => {
      const url = rows ? findUrl(rows, def.sheetLabel) : null;
      const ts  = rows ? findTimestamp(rows, def.sheetLabel) : null;
      const dot = freshnessDot(ts);

      const el = document.createElement('a');
      el.className = 'project-button';
      el.target   = '_blank';
      el.rel      = 'noopener noreferrer';

      if (url) {
        const cleanUrl = url.replace(/\/+$/, '');
        el.href = def.urlSuffix ? cleanUrl + def.urlSuffix : url;
      } else {
        el.classList.add('unavailable');
        el.removeAttribute('href');
        el.setAttribute('aria-disabled', 'true');
        el.title = rows ? 'Link unavailable right now' : 'Could not load links';
      }

      el.innerHTML = `
        <i class="${def.icon} btn-icon" aria-hidden="true"></i>
        <span class="project-button-text">${def.label}</span>
        <span class="freshness-dot ${dot}" title="${dot === 'fresh' ? 'Updated recently' : dot === 'stale' ? 'Updated >2 h ago' : dot === 'expired' ? 'Updated >12 h ago' : 'Age unknown'}"></span>
      `;

      container.appendChild(el);
    });
  }

  /* ─────────────────────────────────────────────
     RENDER ACHIEVEMENTS
     Sheet columns: platform_name | font_awesome_icon | link
  ───────────────────────────────────────────── */
  function renderAchievements(rows) {
    const container = document.getElementById('achievementsContainer');
    const errorEl    = document.getElementById('achievementsError');

    container.innerHTML = '';

    if (!rows) {
      errorEl.classList.remove('hidden');
      return;
    }
    errorEl.classList.add('hidden');

    // Skip a possible header row (e.g. "platform_name, font_awsome_icon, link")
    const dataRows = rows.filter(cells => {
      const name = (cells[0] || '').toLowerCase();
      const link = cells[2] || '';
      if (name.includes('platform_name')) return false;
      return name.trim() !== '' && /^https?:\/\//i.test(link);
    });

    if (dataRows.length === 0) {
      container.innerHTML = `<p class="sheet-error" style="margin:0;"><i class="fa-solid fa-circle-info"></i> No achievements yet</p>`;
      return;
    }

    dataRows.forEach(cells => {
      const name = cells[0] || 'Achievement';
      const iconRaw = (cells[1] || '').trim();
      const link = cells[2] || '';
      const icon = iconRaw || DEFAULT_ACHIEVEMENT_ICON;

      const el = document.createElement('a');
      el.className = 'project-button';
      el.href = link;
      el.target = '_blank';
      el.rel = 'noopener noreferrer';
      el.innerHTML = `
        <i class="${icon} btn-icon" aria-hidden="true"></i>
        <span class="project-button-text">${name}</span>
      `;
      container.appendChild(el);
    });
  }

  async function loadAchievements() {
    const refreshBtn = document.getElementById('achievementsRefreshBtn');
    refreshBtn.classList.add('spinning');

    let rows = null;
    try {
      rows = await fetchAchievementsRows();
    } catch (err) {
      console.warn('Achievements sheet fetch failed:', err.message);
    } finally {
      setTimeout(() => refreshBtn.classList.remove('spinning'), 700);
    }

    renderAchievements(rows);
  }

  /* ─────────────────────────────────────────────
     WIRE + REFRESH
  ───────────────────────────────────────────── */
  async function loadServers() {
    const refreshBtn = document.getElementById('refreshBtn');
    refreshBtn.classList.add('spinning');

    let rows = null;
    try {
      rows = await fetchSheetRows();
    } catch (err) {
      console.warn('Sheet fetch failed:', err.message);
    } finally {
      // Small delay so the spin animation is visible on fast networks
      setTimeout(() => refreshBtn.classList.remove('spinning'), 700);
    }

    renderServers(rows);
  }

  /* ─────────────────────────────────────────────
     INIT
  ───────────────────────────────────────────── */
  document.addEventListener('DOMContentLoaded', () => {
    const body         = document.body;
    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const sideNav      = document.getElementById('sideNav');
    const navBackdrop  = document.getElementById('navBackdrop');
    const themeToggle  = document.getElementById('themeToggle');
    const refreshBtn   = document.getElementById('refreshBtn');
    const petBlob      = document.getElementById('petBlob');
    const petBubble    = document.getElementById('petBubble');
    const pupilLeft    = document.getElementById('pupilLeft');
    const pupilRight   = document.getElementById('pupilRight');

    /* Theme */
    if (localStorage.getItem('theme') === 'light') body.classList.add('light-theme');
    applyDailyAccent();

    themeToggle.addEventListener('click', () => {
      body.classList.toggle('light-theme');
      localStorage.setItem('theme', body.classList.contains('light-theme') ? 'light' : 'dark');
      applyDailyAccent();
    });

    /* Nav */
    function openNav()  {
      sideNav.classList.add('open'); navBackdrop.classList.add('visible');
      hamburgerBtn.classList.add('open'); body.classList.add('nav-open');
      hamburgerBtn.setAttribute('aria-expanded','true');
      sideNav.setAttribute('aria-hidden','false');
    }
    function closeNav() {
      sideNav.classList.remove('open'); navBackdrop.classList.remove('visible');
      hamburgerBtn.classList.remove('open'); body.classList.remove('nav-open');
      hamburgerBtn.setAttribute('aria-expanded','false');
      sideNav.setAttribute('aria-hidden','true');
    }

    hamburgerBtn.addEventListener('click', () => sideNav.classList.contains('open') ? closeNav() : openNav());
    navBackdrop.addEventListener('click', closeNav);
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && sideNav.classList.contains('open')) closeNav(); });

    /* Refresh button */
    refreshBtn.addEventListener('click', loadServers);

    /* Achievements refresh button */
    const achievementsRefreshBtn = document.getElementById('achievementsRefreshBtn');
    achievementsRefreshBtn.addEventListener('click', loadAchievements);

    /* Pet eyes */
    document.addEventListener('mousemove', e => {
      const r = petBlob.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      const angle = Math.atan2(e.clientY - cy, e.clientX - cx);
      const dist  = Math.min(3, Math.hypot(e.clientX - cx, e.clientY - cy) / 40);
      const mx = Math.cos(angle) * dist, my = Math.sin(angle) * dist;
      pupilLeft.style.transform  = `translate(${mx}px, ${my}px)`;
      pupilRight.style.transform = `translate(${mx}px, ${my}px)`;
    });

    /* Pet click */
    const msgs = ['hi there! 👋', 'hello!', '*wiggles*', 'having a good day?', 'boop!', '✨ hey ✨'];
    let msgIdx = 0, bubbleTimer;

    function greet() {
      petBlob.classList.remove('squish');
      void petBlob.offsetWidth;
      petBlob.classList.add('squish');
      petBubble.textContent = msgs[msgIdx];
      msgIdx = (msgIdx + 1) % msgs.length;
      petBubble.classList.add('show');
      clearTimeout(bubbleTimer);
      bubbleTimer = setTimeout(() => petBubble.classList.remove('show'), 1800);
    }

    petBlob.addEventListener('click', greet);
    petBlob.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); greet(); } });

    /* Kick off initial loads */
    loadServers();
    loadAchievements();
  });
  </script>
</body>
</html>
